<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal | Grit.</title>
  <meta name="description" content="札幌・琴似の古着屋 Grit. のJournal(読みもの)。入荷のお知らせや古着との付き合い方を店主が綴ります。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body data-page="blog">
  <div id="site-header"></div>

  <main>
    <article class="post">
      <div class="container container--narrow">
        <div id="post-root" data-reveal aria-busy="true">
          <div class="post-skel" aria-hidden="true">
            <div class="post-skel__line post-skel__line--eyebrow skeleton"></div>
            <div class="post-skel__line post-skel__line--title skeleton"></div>
            <div class="post-skel__line post-skel__line--title post-skel__line--w70 skeleton"></div>
            <div class="post-skel__block skeleton"></div>
            <div class="post-skel__line skeleton"></div>
            <div class="post-skel__line skeleton"></div>
            <div class="post-skel__line post-skel__line--w70 skeleton"></div>
          </div>
        </div>
      </div>
    </article>
  </main>

  <div id="site-footer"></div>

  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/blog.js"></script>

</html>
