<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.21  0 0 0 0 0.16  0.6 0 0 0 -0.2"/>
    </filter>
    <filter id="cloud" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.08  0.5 0 0 0 -0.24"/>
    </filter>
  </defs>
  <rect width="300" height="300" fill="#bdb5a4"/>
  <rect width="300" height="300" filter="url(#cloud)" opacity="0.22"/>
  <rect width="300" height="300" filter="url(#grain)" opacity="0.3"/>
</svg>
