<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Grit.</title>
  <meta name="description" content="札幌・琴似の古着屋 Grit. のオンラインストア。90〜00's を中心に、質感やサイズ、デザインにこだわった古着を一点ずつ掲載しています。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/shop.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>

    <!-- 導入(写真を使わない静かな入口) -->
    <section class="shop-intro">
      <div class="container" data-reveal>
        <h1 class="shop-intro__en">Shop</h1>
        <p class="shop-intro__ja">オンラインストア</p>
        <p class="shop-intro__lead">
          90〜00's を中心に、質感とサイズ、デザインを見て選んだ古着を一点ずつ。
        </p>
      </div>
    </section>

    <!-- カテゴリ絞り込み(枠なしのテキスト。横スクロール・スクロール追従) -->
    <section class="shop-filter" aria-label="カテゴリで絞り込む">
      <div class="container">
        <div class="shop-filter__scroll" id="category-filter"></div>
      </div>
    </section>

    <!-- 商品グリッド -->
    <section class="shop-products" aria-label="商品一覧">
      <div class="container">
        <p class="shop-products__count"><span id="item-count" aria-live="polite">Loading</span></p>
        <div class="grid-products" id="product-grid" data-reveal="stagger"></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/common.js"></script>
  <script type="module" src="../js/shop.js"></script>
</body>
</html>
