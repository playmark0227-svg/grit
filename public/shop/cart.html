<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Grit.</title>
  <meta name="description" content="古着屋 Grit. のお買い物カート。すべて一点物のため、お会計完了をもって売約となります。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/product.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>
  <main class="shop-sub-main shop-sub-main--center">
    <div class="container container--narrow">
      <div class="section-head cart-head" data-reveal>
        <h1 class="section-head__en">Cart</h1>
        <p class="section-head__ja">お買い物カート</p>
      </div>
      <div id="cart-root">
        <div class="cart-skel" aria-hidden="true">
          <div class="skeleton cart-skel__row"></div>
          <div class="skeleton cart-skel__row"></div>
        </div>
      </div>
      <p class="cart-continue">
        <a class="back-link" href="../shop/"><span class="back-link__arrow" aria-hidden="true"></span>買い物を続ける</a>
      </p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/common.js"></script>
  <script type="module" src="../js/cart-page.js"></script>
</body>
</html>
