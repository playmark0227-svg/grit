<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご購入ありがとうございます | Grit.</title>
  <meta name="description" content="古着屋 Grit. — ご注文ありがとうございます。発送までの流れをご案内します。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/product.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>
  <main class="shop-sub-main shop-sub-main--center">
    <div class="container container--narrow">
      <div class="result-box" data-reveal>
        <p class="result-en">Thank You</p>
        <h1 class="result-title">ご購入ありがとうございます</h1>
        <p class="result-lead">
          ご注文をお受けしました。<br>
          一点物とのご縁を、心を込めてお届けします。
        </p>
        <ol class="result-steps">
          <li class="result-step">
            <span class="result-step__num" aria-hidden="true">01</span>
            <div class="result-step__body">
              <p class="result-step__title">ご注文の確認</p>
              <p class="result-step__text">決済完了のご案内がメールで届きます。届かない場合は迷惑メールフォルダもご確認ください。</p>
            </div>
          </li>
          <li class="result-step">
            <span class="result-step__num" aria-hidden="true">02</span>
            <div class="result-step__body">
              <p class="result-step__title">発送の準備</p>
              <p class="result-step__text">検品・梱包のうえ、順次発送の準備をいたします。</p>
            </div>
          </li>
          <li class="result-step">
            <span class="result-step__num" aria-hidden="true">03</span>
            <div class="result-step__body">
              <p class="result-step__title">発送のご連絡</p>
              <p class="result-step__text">発送が完了しましたら、ご登録のメールアドレスへお知らせします。到着まで今しばらくお待ちください。</p>
            </div>
          </li>
        </ol>
        <div class="result-actions">
          <a class="btn" href="../shop/">Shop へ戻る</a>
          <a class="btn btn--ghost" href="../">Home へ</a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/common.js"></script>
  <script type="module">
    // 決済が完了したのでカートを空にする
    import { clearCart } from "../js/common.js";
    clearCart();
  </script>
</body>
</html>
