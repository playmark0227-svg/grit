<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご購入ありがとうございます | GRIT</title>
  <meta name="description" content="ヴィンテージ&古着 GRIT — ご注文ありがとうございます。発送までの流れをご案内します。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/product.css">
</head>
<body data-page="shop" class="theme-denim">
  <div id="site-header"></div>
  <main class="shop-sub-main">
    <div class="container container--narrow">
      <div class="stitch-box result-box">
        <p class="result-tab"><span class="red-tab">GRIT</span></p>
        <p class="result-en">Thank You!</p>
        <h1 class="result-title">ご購入ありがとうございます</h1>
        <p class="result-lead">
          ご注文をお受けしました。<br>
          一点物との良いご縁を、心を込めてお届けします。
        </p>
        <ol class="result-steps">
          <li class="result-step">
            <span class="result-step__num" aria-hidden="true">1</span>
            <div class="result-step__body">
              <p class="result-step__title">ご注文の確認</p>
              <p class="result-step__text">決済完了のご案内がメールで届きます。届かない場合は迷惑メールフォルダもご確認ください。</p>
            </div>
          </li>
          <li class="result-step">
            <span class="result-step__num" aria-hidden="true">2</span>
            <div class="result-step__body">
              <p class="result-step__title">発送の準備</p>
              <p class="result-step__text">検品・梱包のうえ、順次発送の準備をいたします。</p>
            </div>
          </li>
          <li class="result-step">
            <span class="result-step__num" aria-hidden="true">3</span>
            <div class="result-step__body">
              <p class="result-step__title">発送のご連絡</p>
              <p class="result-step__text">発送が完了しましたら、ご登録のメールアドレスへお知らせします。到着まで今しばらくお待ちください。</p>
            </div>
          </li>
        </ol>
        <div class="result-actions">
          <a class="btn btn--red" href="../shop/">SHOPへ戻る</a>
          <a class="btn btn--ghost" href="../">HOMEへ</a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/firebase-config.js"></script>
  <script type="module" src="../js/common.js"></script>
  <script type="module">
    // 決済が完了したのでカートを空にする
    import { clearCart } from "../js/common.js";
    clearCart();
  </script>
</body>
</html>
